# MongoDB connection. Values come from environment variables or a local .env file
# (loaded by spring-dotenv). See .env.example.
spring.data.mongodb.uri=${env.MONGO_URI}
spring.data.mongodb.database=${env.MONGO_DATABASE:movie-reviewer}

# Origins allowed to call /api/** (comma-separated)
app.cors.allowed-origins=${env.CORS_ALLOWED_ORIGINS:http://localhost:3000}
